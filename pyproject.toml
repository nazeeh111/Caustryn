[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phaseglass"
version = "0.2.0"
description = "Find competing radio-scattering locations and design measurements that distinguish them"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = ["numpy>=2.3.5,<3", "scipy>=1.18.1,<2"]
keywords = ["inverse-problems", "radio", "simulation", "observability", "experiment-design"]

[project.urls]
Repository = "https://github.com/nazeeh111/Phaseglass"
Issues = "https://github.com/nazeeh111/Phaseglass/issues"

[project.scripts]
phaseglass = "phaseglass.cli:main"

[tool.setuptools]
packages = ["phaseglass"]
include-package-data = true

[tool.setuptools.package-data]
phaseglass = ["assets/**/*"]
