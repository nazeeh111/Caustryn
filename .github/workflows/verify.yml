name: Verify
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.12"
          - os: ubuntu-24.04
            python: "3.14"
          - os: macos-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - run: python -m pip install -r requirements.lock . wheel 'setuptools>=68'
      - run: python -m unittest discover -s tests -v
      - run: node tests/studio-inputs.mjs studio/app.js
      - run: node --check studio/sweep.js
      - run: node tests/sweep-controls.mjs studio/sweep.js
      - run: python tools/replay_evidence.py --output replay.json
      - run: python tools/replay_coherent.py --output coherent-replay.json
      - name: Build and verify isolated installed package
        shell: bash
        run: |
          set -e
          python -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist
          python -m venv --system-site-packages /tmp/phaseglass-installed
          /tmp/phaseglass-installed/bin/python -m pip install --no-deps --ignore-installed dist/*.whl
          cd /tmp
          /tmp/phaseglass-installed/bin/caustryn --help > /tmp/caustryn-help.txt
          /tmp/phaseglass-installed/bin/phaseglass --help > /tmp/phaseglass-help.txt
          cmp /tmp/caustryn-help.txt /tmp/phaseglass-help.txt
          /tmp/phaseglass-installed/bin/python -c 'from importlib.metadata import distribution; d=distribution("phaseglass"); e={x.name:x.value for x in d.entry_points if x.group=="console_scripts"}; assert e["caustryn"]==e["phaseglass"]=="phaseglass.cli:main"; assert d.version=="0.2.1"; from phaseglass.resources import resource_root; r=resource_root(); assert "<title>Caustryn" in (r/"studio/index.html").read_text(); assert "<title>Caustryn" in (r/"studio/sweep.html").read_text()'
          /tmp/phaseglass-installed/bin/python -c 'from phaseglass.resources import resource_root; from phaseglass import solve; import json; r=resource_root(); assert (r/"studio/sweep.js").is_file(); p=json.loads((r/"examples/measurements/mirror-profiled.json").read_text()); assert solve(p)["candidate_count"]==2'
          /tmp/phaseglass-installed/bin/python "${GITHUB_WORKSPACE}/tools/verify_coherent_installed.py"
