name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . wheel
      - run: python -m unittest discover -s tests -v
      - run: python tools/replay_evidence.py --output replay.json
      - name: Build and verify isolated installed package
        shell: bash
        run: |
          set -e
          python -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist
          python -m venv --system-site-packages /tmp/phaseglass-installed
          /tmp/phaseglass-installed/bin/python -m pip install --no-deps --ignore-installed dist/*.whl
          cd /tmp
          /tmp/phaseglass-installed/bin/python -c 'from phaseglass.resources import resource_root; from phaseglass import solve; import json; r=resource_root(); assert (r/"studio/app.js").is_file(); p=json.loads((r/"examples/measurements/mirror-profiled.json").read_text()); assert solve(p)["candidate_count"]==2'
