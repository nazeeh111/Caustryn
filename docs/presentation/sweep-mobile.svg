<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1190" viewBox="0 0 420 1190" role="img" aria-labelledby="title desc"><title id="title">A prediction can pass without one answer</title><desc id="desc">A coplanar simulated receiver sweep retains two reflected locations. Both training-fitted complex responses predict the separate held positions, with no location or gain refit and no mode selected from held data. All 32 real and 32 imaginary held samples of channel zero are plotted, with a gap between configurations. An independently supplied out-of-plane receiver configuration is only a conditional proposal. A separate changing-response counterfeit passes held prediction while approximately 3.49 metres from its generator truth.</desc><style>text{font-family:Arial,"DejaVu Sans",sans-serif}</style><rect width="100%" height="100%" fill="#101b23"/><text x="28" y="35" font-size="13" fill="#9dc4cb" font-weight="400">PhaseGlass RF / simulated evidence</text><text x="28" y="78" font-size="30" fill="#eff6e9" font-weight="600">Predict there.</text><text x="28" y="116" font-size="30" fill="#eff6e9" font-weight="600">Keep both answers.</text><text x="48" y="159" font-size="15" fill="#eff6e9" font-weight="600">Known geometry and found modes</text><line x1="62.72727273" y1="177.00000000" x2="62.72727273" y2="501.00000000" stroke="#41555f" stroke-width="1"/><text x="58.72727272727273" y="523" font-size="12" fill="#a8bbc5" font-weight="400">0</text><line x1="210.00000000" y1="177.00000000" x2="210.00000000" y2="501.00000000" stroke="#41555f" stroke-width="1"/><text x="206.0" y="523" font-size="12" fill="#a8bbc5" font-weight="400">3</text><line x1="357.27272727" y1="177.00000000" x2="357.27272727" y2="501.00000000" stroke="#41555f" stroke-width="1"/><text x="353.2727272727273" y="523" font-size="12" fill="#a8bbc5" font-weight="400">6</text><line x1="48.00000000" y1="486.27272727" x2="372.00000000" y2="486.27272727" stroke="#41555f" stroke-width="1"/><text x="24" y="490.27272